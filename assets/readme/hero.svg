    <text x="56" y="134" font-size="62" font-weight="700" fill="#f2f2f5">小桑作品集</text>
    <text x="56" y="172" font-size="22" fill="#c9c9d1">XIAOSANG PORTFOLIO — xiaosang.cc</text>
    <text x="56" y="210" font-size="19" fill="#a1a1aa">small ideas, better products</text>
    <text x="56" y="240" font-size="18" fill="#8a8a94">项目列表由 data/repos.json 驱动，改一个 JSON 更新全站。</text>
    <g id="chips" font-size="18" fill="#e8e8ec" text-anchor="middle">
      <g><rect x="56" y="266" width="150" height="36" rx="18" fill="#1c1c22" stroke="#33333d" stroke-width="1.5"/><text x="131" y="290">130 个在展项目</text></g>
