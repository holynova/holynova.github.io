<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">小桑作品集 — xiaosang.cc 的源码仓库</title>
  <desc id="desc">深色底作品集横幅：小桑作品集，副标题 small ideas, better products；右侧是三列错落的迷你项目卡片组成的瀑布流，象征首页的卡片墙；底部是 130 个在展项目、9 大分类、搜索加筛选三个标签。</desc>

  <rect width="1200" height="360" rx="26" fill="#101014"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
