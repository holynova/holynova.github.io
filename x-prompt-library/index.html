adius:6px;padding:4px 10px;font-size:12px}.copy:hover{border-color:var(--accent);color:var(--accent)}.copy.done{color:var(--accent);background:#edf2ef;border-color:#9db7a6}.copy svg{width:13px;height:13px;flex-shrink:0}.text{font:14px/1.95 "SFMono-Regular",Consolas,"PingFang SC",monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;tab-size:2;color:#313b37}.text[lang="en"]{line-height:1.85}.context{font-size:12px;color:var(--muted);margin:16px 0 24px}.context p{max-width:820px;margin:10px 0;line-height:1.9}summary{cursor:pointer;width:fit-content}.pager{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:18px;margin-top:24px}.pager button{border:0;background:transparent;padding:7px 0;color:var(--muted);font-size:12px;max-width:45%;text-align:left}.pager button:last-child{text-align:right}.pager button:hover{color:var(--accent)}.pager button:disabled{opacity:.3;cursor:default}.empty{padding:65px 20px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:20px}.empty strong{font-size:18px;color:var(--ink);font-weight:500}.reset{border:1px solid var(--line);border-radius:6px;background:white;padding:7px 15px}.mobile-toggle{display:none}.intro{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.7}.sitefoot{color:var(--muted);font-size:12px;margin-top:32px;line-height:1.9}.sitefoot p{margin:12px 0}.manual-copy{position:fixed;inset:0;background:#0007;z-index:40;display:grid;place-items:center;padding:20px}.manual-copy section{max-width:650px;width:100%;background:white;padding:24px;border-radius:10px}.manual-copy textarea{width:100%;height:220px;font:14px/1.7 monospace}.manual-copy button{padding:8px 16px;margin-top:12px;border:1px solid var(--line);background:white;border-radius:6px}.manual-copy[hidden]{display:none}

<script id="library-data" type="application/json">[{"group": "界面与品牌设计", "name": "极简产品与界面", "author": "wanerfu", "url": "https://x.com/wanerfu/status/2118610590042304686", "use": "给新网站或 App 定下简洁的产品、架构与视觉方向。", "detail": "以 Linear 或苹果备忘录为参照；减少标语、提示和次要标签，优先通过布局让功能易懂；同时考虑用户、开发者及智能体使用体验。", "note": "与“让布局自己解释”高度相关，可合并成一套项目设计原则。", "prompts": [{"title": "极简产品与界面原则", "original": "我要把它做得像 Linear 的官网或者苹果备忘录一样干净：目标简单、架构简单、设计简单、实现简单。砍掉标语、提示文字和次要标签。如果一个页面非得靠这些东西才看得懂，那就去改布局。每个决定都要同时提升用户体验（UX）、开发者体验（DX）和智能体体验（AX），而且不能弄坏任何东西。", "translation": "", "url": "https://x.com/wanerfu/status/2118610590042304686", "lang": "zh", "note": ""}], "id": 1}, {"group": "界面与品牌设计", "name": "10 条 UI 优化提示", "author": "ZaynHao", "url": "https://x.com/ZaynHao/status/2113456751915982917", "use": "对已有界面逐项打磨，减少常见的 AI 生成痕迹。", "detail": "覆盖文案分隔符、冗余说明、文案受众、Radix 配色、光学对齐与同心圆角、边框、动画、字号数量、信息优先级、圆角及阴影。", "note": "0.5px、字号数量、动画时长等是作者偏好，整理时不把它们当成通用规范。", "prompts": [{"title": "UI 优化 01", "original": "不要使用中点 “·”作为文案的分隔符。如果有，移除它。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 02", "original": "不要在界面添加冗余的解释性描述文本，这会弄脏 UI 界面，还会浪费用户的注意力。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 03", "original": "review 界面文案，尽量使其描述符合当前界面面相的人群，容易理解但不要过于口语化，长短适合其功能场景，不要冗余和随意造词。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 04", "original": "将页面所有使用的颜色，都换成 Radix UI Colors 的颜色。同时，使用那套颜色的使用规范来优化颜色使用。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 05", "original": "优化界面元素与 UI 的对齐效果，尽量做到光学对齐；有嵌套的地方，尽量做到同心圆圆角处理。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 06", "original": "如果你需要使用线条或者边框，请使用 0.5px 边框。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 07", "original": "尽量减少页面中的元素动画过渡效果，如果一定要添加，7则考虑通常 ease-out，250ms 是个不错的基础设定。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 08", "original": "界面的文字大小不要超过 4 种，最好三种。最小可用文字尺寸是 12px。如果不够用，可以考虑使用字重、字体颜色、间距设计来调整页面的关系结构。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 09", "original": "尽量减少页面出现需要用户判断才能进行的交互；必须发生时，放在用户本来就打算做选择的地方。同时，重新思考页面中包含的功能和元素，判断信息优先级，使用更有秩序的做法进行组织。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}, {"title": "UI 优化 10", "original": "尽量不要随意在页面中使用圆角，阴影，尤其是一个卡片的左边缘带颜色的线条。如果非要使用圆角和阴影，请注意其值的设定，符合其功能场景。", "translation": "", "url": "https://x.com/ZaynHao/status/2113456751915982917", "lang": "zh", "note": ""}], "id": 2}, {"group": "界面与品牌设计", "name": "让布局自己解释", "author": "luinlee", "url": "https://x.com/luinlee/status/2113085361836744764", "use": "约束 Agent 少写无用的小标签、口号和解释文案。", "detail": "原帖短句：Avoid unnecessary secondary labels and descriptions. Let the layout do the explaining. 可作为 AGENTS.md 中的一条界面原则。", "note": "", "prompts": [{"title": "减少次要标签与说明", "original": "Avoid unnecessary secondary labels and descriptions. Let the layout do the explaining.", "translation": "避免不必要的次要标签和说明。让布局自己解释。", "url": "https://x.com/luinlee/status/2113085361836744764", "lang": "en", "note": ""}], "id": 3}, {"group": "界面与品牌设计", "name": "设计奖项标准自检", "author": "kajikent", "url": "https://x.com/kajikent/status/2105095422448746573", "use": "给网页设计任务设定较高的质量目标，并要求自查迭代。", "detail": "在需求后追加 Awwwards、Webby、FWA 等品质参照，要求审视并提升完成品。", "note": "它提供的是品质方向；真正验收仍需明确页面目标、参考和可检查的标准。", "prompts": [{"title": "以设计奖项品质自检", "original": "クオリティ基準としては awwwardsやwebby awards、FWAで賞を穫れるくらいのクオリティを目指して、セルフチェックでそのクオリティ基準になるまで自分でクオリティアップを繰り返して", "translation": "作为品质标准，目标是达到awwwards、webby awards、FWA能获奖的品质，通过自我检查，反复提升品质，直到达到那个品质标准为止", "url": "https://x.com/kajikent/status/2105095422448746573", "lang": "ja", "note": ""}], "id": 4}, {"group": "界面与品牌设计", "name": "品牌与 Logo 的 10 个提示", "author": "heyalexmoore", "url": "https://x.com/heyalexmoore/status/2094776149239025731", "use": "从品牌定位一路推进到 Logo 方案、视觉规范和最终选择。", "detail": "合集包含品牌身份、Logo 概念、极简高端 Logo、完整视觉方向、配色字体、字母标志、Logo 审查、生图提示构建、品牌指南、最终选型。完整子项见下表。", "note": "已打开 10 条作者续帖核对内容；偏向设计策划与生成指令，不代表直接获得最终矢量文件。", "prompts": [{"title": "品牌身份发现", "original": "Act like a senior brand strategist. Build a brand identity foundation for [Brand Name] in [Industry] for [Target Audience].\nMy brand offers [Product/Service] and should feel [Premium/Friendly/Bold/Minimal/Futuristic/etc.].\nGive me:\n5 brand personality traits\nTone of voice\nMission statement\nPositioning statement\n3 taglines\nVisual style to avoid\nWhat the logo should communicate\n5 words people should associate with the brand\nSimple logo creative direction\nMake it practical and beginner-friendly.", "translation": "扮演一名资深品牌策略师。为 [Brand Name] 在 [Industry] 行业中针对 [Target Audience] 打造品牌身份基础。\n我的品牌提供 [Product/Service]，并应传递出 [Premium/Friendly/Bold/Minimal/Futuristic/等] 的感觉。\n请提供：\n5 个品牌个性特征\n语言风格\n使命宣言\n定位宣言\n3 个标语\n应避免的视觉风格\n标志应传达的内容\n人们应联想到品牌的 5 个词\n简易标志创意指导\n让它实用且适合初学者。", "url": "https://x.com/heyalexmoore/status/2094776161465475353", "lang": "en", "note": ""}, {"title": "Logo 概念生成", "original": "Act like an award-winning logo designer. Create 10 unique logo concepts for [Brand Name].\nDetails:\nIndustry: [Industry]\nAudience: [Audience]\nPersonality: [Modern/Luxury/Playful/Bold/etc.]\nMain message: [Message]\nPreferred style: [Wordmark/Monogram/Icon/Emblem/Abstract]\nColors: [Preferred colors]\nFor each concept, include the concept name, symbol idea, typography style, color direction, why it works, and best use case.\nAvoid generic logo ideas.", "translation": "扮演一位屡获殊荣的标志设计师。为 [Brand Name] 创建 10 个独特的标志概念。\n细节：\n行业：[Industry]\n受众：[Audience]\n个性：[Modern/Luxury/Playful/Bold/etc.]\n主要信息：[Message]\n首选风格：[Wordmark/Monogram/Icon/Emblem/Abstract]\n颜色：[Preferred colors]\n对于每个概念，请包括概念名称、符号创意、字体风格、颜色方向、为何有效，以及最佳使用场景。\n避免通用标志创意。", "url": "https://x.com/heyalexmoore/status/2094776173209522404", "lang": "en", "note": ""}, {"title": "极简高端 Logo", "original": "Act like a luxury brand identity designer. Create 7 minimal, premium logo directions for [Brand Name].\nBrand details:\nIndustry: [Industry]\nAudience: [Audience]\nVibe: [Elegant/Exclusive/Timeless/Modern]\nInspiration brands: [Brands]\nFor each direction, include logo style, monogram or symbol idea, font style, color palette, layout notes, why it feels premium, and an AI image prompt.\nKeep it clean and expensive-looking.", "translation": "扮演一位奢华品牌形象设计师。为[Brand Name]创建7个极简、高端标志方向。\n品牌详情：\n行业：[Industry]\n受众：[Audience]\n氛围：[Elegant/Exclusive/Timeless/Modern]\n灵感品牌：[Brands]\n对于每个方向，包括标志风格、首字母组合或符号创意、字体风格、配色方案、布局说明、为什么它感觉高端，以及一个AI图像提示。\n保持简洁且外观昂贵。", "url": "https://x.com/heyalexmoore/status/2094776185230446991", "lang": "en", "note": ""}, {"title": "完整视觉方向", "original": "Act like a creative director. Create a complete visual direction for [Brand Name].\nDetails:\nIndustry: [Industry]\nAudience: [Audience]\nValues: [Values]\nDesired feeling: [Feeling]\nOffer: [Product/Service]\nInclude logo style, color palette with hex codes, typography, icon style, photography style, social media style, website style, packaging direction, 5 design do’s, and 5 design don’ts.\nMake it easy for beginners.", "translation": "扮演创意总监的角色。为[Brand Name]创建一个完整的视觉方向。\n细节：\n行业：[Industry]\n受众：[Audience]\n价值观：[Values]\n期望的感觉：[Feeling]\n产品/服务：[Product/Service]\n包括标志风格、带有十六进制代码的颜色调色板、字体、图标风格、摄影风格、社交媒体风格、网站风格、包装方向、5个设计要做的，以及5个设计不要做的。\n让它对初学者来说易于理解。", "url": "https://x.com/heyalexmoore/status/2094776197377065107", "lang": "en", "note": ""}, {"title": "配色与字体", "original": "Act like a professional brand designer. Recommend colors and typography for [Brand Name].\nDetails:\nIndustry: [Industry]\nAudience: [Audience]\nPersonality: [Personality]\nLogo style: [Minimal/Bold/Luxury/Playful/etc.]\nGive me 3 color palette options with hex codes, meaning behind each color, the best palette choice, logo font style, heading font style, body font style, font pairing ideas, and combinations to avoid.\nBe specific.", "translation": "像专业品牌设计师一样行事。为 [Brand Name] 推荐配色方案和字体。\n细节：\n行业：[Industry]\n受众：[Audience]\n个性：[Personality]\n标志风格：[Minimal/Bold/Luxury/Playful/等]\n给我 3 个配色方案选项，包含十六进制代码，每种颜色的含义、最佳方案选择、标志字体风格、标题字体风格、正文字体风格、字体搭配创意，以及要避免的组合。\n要具体。", "url": "https://x.com/heyalexmoore/status/2094776209309855790", "lang": "en", "note": ""}, {"title": "字母组合标志", "original": "Act like an expert monogram logo designer. Create 10 monogram logo concepts using the initials [Initials] for [Brand Name].\nDetails:\nIndustry: [Industry]\nVibe: [Luxury/Bold/Modern/Futuristic/etc.]\nAudience: [Audience]\nUsage: [Website/Social/Profile/Packaging/App      Icon]\nFor each concept, explain how the letters connect, shape idea, font style, meaning, color direction, overall feel, and an AI image prompt.\nMake every concept visually different.", "translation": "扮演一名专业的个性化字母标志设计师。使用首字母 [Initials] 为 [Brand Name] 创建 10 个个性化字母标志概念。\n细节：\n行业：[Industry]\n氛围：[Luxury/Bold/Modern/Futuristic/etc.]\n受众：[Audience]\n用途：[Website/Social/Profile/Packaging/App      Icon]\n对于每个概念，请解释字母如何连接、形状创意、字体风格、含义、颜色方向、整体感觉，以及一个 AI 图像提示。\n确保每个概念在视觉上都不同。", "url": "https://x.com/heyalexmoore/status/2094776221062271401", "lang": "en", "note": ""}, {"title": "Logo 审查", "original": "Act like a strict senior logo designer. Review this logo idea for [Brand Name]:\n[Describe logo idea]\nBrand details:\nIndustry: [Industry]\nAudience: [Audience]\nPersonality: [Personality]\nAnalyze memorability, uniqueness, audience fit, black-and-white use, small-size use, professionalism, what to remove, what to improve, and how to make it stronger.\nAlso give me 3 better alternative concepts.", "translation": "扮演一位严格的资深标志设计师。审视这个针对[Brand Name]的标志创意：\n[Describe logo idea]\n品牌详情：\n行业：[Industry]\n受众：[Audience]\n个性：[Personality]\n分析其易记性、独特性、受众契合度、黑白使用效果、小尺寸使用效果、专业性、需移除的部分、需改进的部分，以及如何使其更强。\n另外，提供3个更好的替代概念。", "url": "https://x.com/heyalexmoore/status/2094776232789598631", "lang": "en", "note": ""}, {"title": "AI Logo 提示构建", "original": "Act like an expert AI logo prompt engineer. Create 10 image promptsfor logo generation.\nDetails:\nBrand name: [Brand Name]\nIndustry: [Industry]\nAudience: [Audience]\nStyle: [Minimal/Luxury/Bold/Playful/Futuristic]\nSymbol idea: [Optional symbol]\nColors: [Preferred colors]\nEach prompt should include logo type, main symbol, style, typography, colors, background, and what to avoid.\nMake the prompts clean and professional.", "translation": "扮演一位专业的 AI Logo 提示词工程师，创建 10 条用于生成 Logo 的图像提示词。\n信息：\n品牌名：[Brand Name]\n行业：[Industry]\n受众：[Audience]\n风格：[Minimal/Luxury/Bold/Playful/Futuristic]\n符号创意：[Optional symbol]\n颜色：[Preferred colors]\n每条提示词应包含标志类型、主要符号、风格、字体、颜色、背景以及需要避免的内容。\n保持提示词简洁、专业。", "url": "https://x.com/heyalexmoore/status/2094776244734988366", "lang": "en", "note": ""}, {"title": "品牌指南", "original": "Act like a brand guideline designer. Create a simple brand guideline for [Brand Name].\nDetails:\nIndustry: [Industry]\nAudience: [Audience]\nPersonality: [Personality]\nLogo concept: [Logo idea]\nColors: [Colors or ask Claude to suggest]\nInclude brand overview, logo usage rules, spacing rules, colors, typography, icon style, image style, social media style, correct usage examples, incorrect usage examples, and 10 brand words.\nMake it beginner-friendly.", "translation": "扮演品牌指南设计师的角色。为 [Brand Name] 创建一个简单的品牌指南。\n细节：\n行业：[Industry]\n受众：[Audience]\n个性：[Personality]\n标志概念：[Logo idea]\n颜色：[Colors 或请求 Claude 提出建议]\n包括品牌概述、标志使用规则、间距规则、颜色、字体、图标风格、图像风格、社交媒体风格、正确使用示例、不正确使用示例，以及 10 个品牌词汇。\n让它适合初学者友好。", "url": "https://x.com/heyalexmoore/status/2094776256701297120", "lang": "en", "note": ""}, {"title": "最终 Logo 选型", "original": "Act like a creative director. Help me choose the best logo concept.\nMy concepts:\n[Concept 1]\n[Concept 2]\n[Concept 3]\n[Concept 4]\n[Concept 5]\nBrand details:\nBrand name: [Brand Name]\nIndustry: [Industry]\nAudience: [Audience]\nPersonality: [Personality]\nGoal: [Business goal]\nRank the concepts from strongest to weakest based on memorability, simplicity, professionalism, uniqueness, audience fit, scalability, social media use, and long-term potential.\nRecommend the best one and explain how to improve it before finalizing.", "translation": "扮演创意总监的角色。帮助我选择最佳标志概念。  \n我的概念：  \n[Concept 1]  \n[Concept 2]  \n[Concept 3]  \n[Concept 4]  \n[Concept 5]  \n品牌细节：  \n品牌名称：[Brand Name]  \n行业：[Industry]  \n受众：[Audience]  \n个性：[Personality]  \n目标：[Business goal]  \n根据易记性、简洁性、专业性、独特性、受众契合度、可扩展性、社交媒体适用性和长期潜力，从最强到最弱对这些概念进行排名。  \n推荐最佳的一个，并解释在最终确定前如何改进它。", "url": "https://x.com/heyalexmoore/status/2094776268650897520", "lang": "en", "note": ""}], "id": 5}, {"group": "代码质量", "name": "深化模块、简化接口", "author": "_khrus", "url": "https://x.com/_khrus/status/2118971805885239777", "use": "重构 AI 写出的碎片化代码，减少调用方负担。", "detail": "把复杂行为封装到真正拥有该概念的模块中；合并没有价值的薄层模块；消除可推导、重复或无人使用的参数，再迁移调用方并删除旧路径。", "note": "作者在回复中补充了较长模板；适合在完成 PR 后单独做一次重构审查。", "prompts": [{"title": "模块深化与接口简化", "original": "Make each module deep: a simple interface hiding a lot of behavior. If deleting a module would only push its complexity back onto its callers, it's earning its place; if nothing would be lost, merge it away. Put each concept in the one module that owns it, and pull special cases, ordering rules, validation and derived values inside, so callers never have to know them. Shrink the interface until there's one obvious way to call it: drop any parameter, flag or option the module can work out itself, that every caller passes the same way, or that nobody reads, then move every caller to the new shape and delete the old path completely.", "translation": "让每个模块深入：一个简单的接口隐藏大量行为。如果删除一个模块只会将其复杂性推回给它的调用者，那么它就物有所值；如果没有任何损失，就将其合并掉。将每个概念放在拥有它的那个模块中，并将特殊情况、排序规则、验证和派生值拉进来，这样调用者就永远不必了解它们。将接口缩小，直到只有一种显而易见的方式来调用它：删除任何模块自己能推导出的参数、标志或选项、每个调用者都以相同方式传递的参数，或者没人读取的参数，然后将每个调用者迁移到新形状，并完全删除旧路径。", "url": "https://x.com/_khrus/status/2118974674336141739", "lang": "en", "note": ""}], "id": 6}, {"group": "代码质量", "name": "独立推演后审查 PR", "author": "dotey", "url": "https://x.com/dotey/status/2097878840655626568", "use": "降低审查者被现有实现带偏的概率。", "detail": "先理解 PR 要解决的问题，再独立思考实现方案，最后阅读代码并比较。作者续帖补充：建议附带 Markdown diff，让修改方式清楚可见。", "note": "", "prompts": [{"title": "先独立思考，再审查 PR", "original": "1. 先搞清楚这个 PR 解决的问题是什么\n2. 如果不看这个 PR 的实现，要解决这个问题你会怎么实现？\n3. review 代码后对比你自己的方案给出审查结果", "translation": "", "url": "https://x.com/dotey/status/2097878840655626568", "lang": "zh", "note": ""}, {"title": "审查结果附修改 diff", "original": "不仅给出建议，同时给出 markdown 格式的 diff 代码，让别人看了知道该怎么修改", "translation": "", "url": "https://x.com/dotey/status/2100350946194722832", "lang": "zh", "note": "作者续帖补充；原文见本组来源的作者回复。"}], "id": 7}, {"group": "代码质量", "name": "第一性原理精简代码库", "author": "georgepickett", "url": "https://x.com/georgepickett/status/2095979879137460640", "use": "在功能完成后审视多余代码、过度复杂性和薄弱假设。", "detail": "依次问哪些东西没有必要、哪些可以彻底删除、剩下哪些可以简化；处理优先级是删除、简化、优化、自动化。若已经合理，可以不改。", "note": "原模板会授权修改代码；真正使用时应明确范围及验证要求。", "prompts": [{"title": "第一性原理精简", "original": "Think from first principles about what we're trying to achieve here. Interrogate what you built before calling it done:\n\n1. is anything here unnecessary, overly complicated, or based on weak assumptions? Challenge them.\n2. What can be deleted entirely?\n3. What can be simplified now that unnecessary pieces are gone?\n\nThen make the changes. Prefer deleting over simplifying, simplifying over optimizing, and optimizing over automating.\n\nIt might be done too - you dont HAVE to go and make changes. if its good, leave it alone", "translation": "从第一性原理思考我们在这里试图实现的目标。在称其为完成之前，审视你之前构建的东西：\n\n1. 这里有没有任何不必要的东西、过于复杂的东西，或基于薄弱假设的东西？挑战它们。\n2. 什么可以完全删除？\n3. 现在不必要的东西删除了之后，什么可以简化？\n\n然后进行更改。优先删除而不是简化，简化而不是优化，优化而不是自动化。\n\n它可能已经完成了——你不必非得去更改。如果它很好，就让它保持原样。", "url": "https://x.com/georgepickett/status/2095979879137460640", "lang": "en", "note": ""}], "id": 8}, {"group": "个人工作流与 Agent", "name": "历史对话挖掘与 Skill 候选", "author": "seekjourney", "url": "https://x.com/seekjourney/status/2074090532775809227", "use": "从已有对话里发现盲点和高价值重复工作。", "detail": "要求识别用户尚未意识到、会影响决策的重要线索，并挑出三个最值得封装成 Skill 的重复任务，说明原因和场景。", "note": "能分析多少取决于实际可访问的聊天、项目与记忆。", "prompts": [{"title": "历史洞察与三个 Skill 候选", "original": "请扫描、读取所有的历史对话信息以及记忆：\n\n1. 有什么东西是你发现了但我完全没有意识到的关键点？而且这个关键点会对我的决策和工作带来巨大的改变。\n\n2. 我有哪些重复的工作内容，从里面挑出三个最值得封装成SKILL的给我，并且说明原因和使用场景。", "translation": "", "url": "https://x.com/seekjourney/status/2074090532775809227", "lang": "zh", "note": ""}], "id": 9}, {"group": "个人工作流与 Agent", "name": "五条 Codex 提效建议", "author": "binghe", "url": "https://x.com/binghe/status/2069386692155601299", "use": "做一次跨项目的个人使用方式审计。", "detail": "检查历史聊天和项目，提出五种让 Codex 工作更简洁高效的方法，原帖要求使用子代理并用中文回复。", "note": "作者回复建议作为一次性审计使用，不必常驻系统提示。", "prompts": [{"title": "五个提效方向", "original": "Look across my threads and projects and come up with five ways to simplify and work more efficiently with Codex. Use sub-agents.用中文回复我", "translation": "审阅我的聊天与项目，提出五种让 Codex 使用方式更简洁、更高效的方法。使用子代理。用中文回复我。", "url": "https://x.com/binghe/status/2069386692155601299", "lang": "en", "note": ""}], "id": 10}, {"group": "个人工作流与 Agent", "name": "复盘执行经验与个人偏好", "author": "vista8", "url": "https://x.com/vista8/status/2059473257942958578", "use": "把实践经验沉淀为以后能复用的文档或 Skill。", "detail": "检索对话及日志，整理错误与正确做法、UI 与产品偏好、可复用行为规则，保存为独立文档。", "note": "完整提示在作者第一条回复；原帖具体加载配置方式需要按当前环境核实。", "prompts": [{"title": "经验、偏好与规则沉淀", "original": "阅读并检索我们所有的 Codex 对话记录与执行日志，进行系统性复盘，提炼出可复用的经验文档。\n\n文档需要涵盖以下内容：\n一、执行经验总结：记录哪些做法导致了问题、最终正确的执行方式是什么，以及从中得出的教训。\n\n二、我的偏好与理念提炼：从对话中识别并归纳我的 UI 设计偏好、产品设计理念、交互原则等，形成结构化的个人风格档案。\n\n三、可复用规则清单：将上述内容整理为 Codex 未来可直接遵循的行为准则。\n\n完成文档后，将其保存为独立文件，并在 .agent 配置中以地址引用的方式加载该文档，使后续所有 Codex 会话默认继承这些经验，无需重复说明。", "translation": "", "url": "https://x.com/vista8/status/2059473425857720768", "lang": "zh", "note": ""}], "id": 11}, {"group": "个人工作流与 Agent", "name": "配置专用子代理", "author": "Tz_2022", "url": "https://x.com/Tz_2022/status/2083568833164419449", "use": "让主 Agent 统筹，把边界清晰的任务交给独立工作者。", "detail": "创建 luna_worker 配置，补充职责描述和工作指令，保持任务范围；检查版本兼容性、展示 diff、验证配置。", "note": "模型名称与配置语法按原帖记录，使用前需要核对当前版本；本次只整理，没有执行配置。", "prompts": [{"title": "创建 luna_worker", "original": "请在以下路径创建一个名为 luna_worker 的自定义 Agent：  ~/.codex/agents/luna-worker.toml  使用以下配置：  model = \"gpt-5.6-luna\" model_reasoning_effort = \"max\"  请为这个 Agent 补充清晰的 description 和 instructions。  luna_worker 只负责处理范围明确、边界清晰、可以独立完成的委派任务，不负责修改整体任务目标，也不要自行扩大工作范围。  请保留我现有的其他 Codex 配置，不要覆盖或删除无关内容。  创建完成后：  1. 根据我当前安装的 Codex 版本检查配置格式是否兼容； 2. 展示本次修改产生的 diff； 3. 确认配置有效； 4. 后续需要调用子代理时，优先使用 luna_worker。", "translation": "", "url": "https://x.com/Tz_2022/status/2083568833164419449", "lang": "zh", "note": ""}], "id": 12}, {"group": "个人工作流与 Agent", "name": "配置自定义模型", "author": "wei_wang", "url": "https://x.com/wei_wang/status/2067443263276003667", "use": "让 Codex 协助连接 API 或本地模型并检查配置。", "detail": "读取现有配置后增量添加，避免覆盖无关内容，不明文保存密钥，并校验 TOML。续帖覆盖 Ollama、DeepSeek、本地服务、model catalog 和配置自检。", "note": "服务端协议、模型名及目录是原帖方案，需要按实际安装环境检查。", "prompts": [{"title": "添加自定义模型", "original": "请读取 ~/.codex/config.toml，帮我添加自定义模型配置。\n不要覆盖已有配置，不要把 API Key 明文写进文件。\n配置完检查 TOML 语法，并告诉我是否需要重启 Codex Desktop。", "translation": "", "url": "https://x.com/wei_wang/status/2067443263276003667", "lang": "zh", "note": ""}, {"title": "配 Ollama", "original": "请把 Ollama 配成 Codex 自定义模型。\n先检查 http://localhost:11434/v1/models 是否可访问。\n模型用 qwen3:8b。\nProvider id 用 local_ollama。\nBase URL 用 http://localhost:11434/v1。\nwire_api 用 responses。", "translation": "", "url": "https://x.com/wei_wang/status/2067443268367831245", "lang": "zh", "note": ""}, {"title": "配 DeepSeek API", "original": "请把 DeepSeek API 配成 Codex 自定义模型。\n模型用 deepseek-v4-pro。\nProvider id 用 deepseek。\nBase URL 用 \nhttps://api.deepseek.com。\nAPI Key 从 DEEPSEEK_API_KEY 环境变量读取。\n不要把 key 写进 config.toml。", "translation": "", "url": "https://x.com/wei_wang/status/2067443270028820701", "lang": "zh", "note": ""}, {"title": "配本地部署模型，比如 LM Studio / vLLM / SGLang", "original": "请检查 http://127.0.0.1:8000/v1/models。\n如果可用，把第一个模型配置成 Codex 自定义模型。\nProvider id 用 local_model。\nBase URL 用 http://127.0.0.1:8000/v1。\n优先使用 wire_api = \"responses\"。", "translation": "", "url": "https://x.com/wei_wang/status/2067443271496823084", "lang": "zh", "note": ""}, {"title": "如果下拉菜单里只显示 Custom，继续让 Codex 处理", "original": "请帮我创建 Codex model catalog：\n~/.codex/model-catalogs/custom-models.json\n\n把 Ollama、DeepSeek、本地模型加进去，并在 ~/.codex/config.toml 添加 model_catalog_json。", "translation": "", "url": "https://x.com/wei_wang/status/2067443272914546718", "lang": "zh", "note": ""}, {"title": "最后让 Codex 自检", "original": "请检查：\n1. config.toml 语法是否正确\n2. model_provider 是否和 provider id 对应\n3. base_url 是否写对\n4. API Key 是否没有明文保存\n5. 是否需要 Responses 兼容代理", "translation": "", "url": "https://x.com/wei_wang/status/2067443274780922062", "lang": "zh", "note": ""}], "id": 13}, {"group": "个人工作流与 Agent", "name": "反附和与不确定性标记", "author": "GavinAgent", "url": "https://x.com/GavinAgent/status/2065095243553485086", "use": "让 AI 主动指出漏洞，并区分事实、推断和猜测。", "detail": "要求不要机械赞同，明确表达异议与理由，标注判断把握，减少空话；用户反驳时只因新证据而更新判断。", "note": "原文还要求第一句必须质疑，可能显得过度对抗；可保留证据与独立判断部分。", "prompts": [{"title": "反附和与证据标记", "original": "- 别上来就附和我。你的第一句话必须做这三件事之一：质疑我的前提、点破我漏掉的东西，或者甩一个能戳穿我思路漏洞的问题。\n- 标明你有几分把握。每句判断前面加标记：有确凿依据用 [确定]，是有力推断用 [很可能]，是在瞎猜补缺用 [推测]。要是整段大部分都在猜，开头就老实承认。\n- 这几句话永远别说：\"好问题\"\"你说得对\"\"这很有道理\"\"当然\"\"毫无疑问\"。发现自己手滑写了，删掉重写。\n- 反对就把话讲明白。我错的时候，这么说：\"我不同意，因为 \\_**\\_。我建议改成 \\_\\_**。你这做法的雷在 \\_\\_\\_\\_。\"\n- 先说难听的。有个我八成不爱听的事实，第一行就拍出来，别埋到第三段。\n- 别写废话铺垫。跳过\"这事可以从几个角度看\"那套开场，张嘴就讲最有用的。\n- 我反驳你别怂。除非我拿出真正的新信息，否则守住你的判断。\"可我就是觉得……\"不算新信息。", "translation": "", "url": "https://x.com/GavinAgent/status/2065095243553485086", "lang": "zh", "note": ""}], "id": 14}, {"group": "图像与视频创作", "name": "HyperFrames 产品发布片：生成＋改进", "author": "kaolti", "url": "https://x.com/kaolti/status/2103481296018092204", "use": "为产品自动研究品牌、写脚本并生成可播放的发布视频。", "detail": "第一轮研究 Cosmos 的价值主张，统一品牌视觉、文案与动效并生成项目；第二轮看实际成片，改进节奏、剪切、细节与吸引力，交付 v2。", "note": "两条完整提示均已核对。", "prompts": [{"title": "第一轮：产品研究与发布片", "original": "Create a launch video for \nhttp://Cosmos.so using HyperFrames. Research \nhttp://Cosmos.so yourself and identify its unique value proposition, then communicate that proposition accurately. Make the video exciting, engaging, modern, and worthy of a contemporary product launch. Its UI, colors, typography, branding, design language, and motion language should feel unmistakably Cosmos. Choose the concept, story, copy, pacing, imagery, and animation yourself. Build a complete, playable HyperFrames Studio project in this folder, review it at normal speed, and give me the Studio link.", "translation": "使用 HyperFrames 为 \nhttp://Cosmos.so 创建一个发布视频。自行研究 \nhttp://Cosmos.so，并识别其独特价值主张，然后准确传达该价值主张。让视频激动人心、引人入胜、现代感十足，并配得上当代产品发布的档次。其 UI、颜色、排版、品牌、设计语言和动态语言应让人明显感受到 Cosmos 的风格。自行选择概念、故事、文案、节奏、图像和动画。在此文件夹中构建一个完整、可播放的 HyperFrames Studio 项目，以正常速度审阅它，并给我 Studio 链接。", "url": "https://x.com/kaolti/status/2103481493532148036", "lang": "en", "note": ""}, {"title": "第二轮：视觉回看与节奏改进", "original": "I want you to examine your result visually. I want you to examine the rhythm of it, the speed of it, everything, and look for ways to improve it. Remember that the goal is to make it exciting, more energetic, and more fit for social media, meaning probably quicker cuts and just more subtle detail and more subtle polish across the board.\n\nAs I'm looking at it, in some places it feels a bit slow. In some places it feels a bit boring. I need you to make it 5x more exciting. Think about using maybe 3JS, maybe some shaders, maybe whatever you need, or something to make it more exciting and more creative. Just make it much more creative, clever, fun to watch, and more exciting to watch, so that even if you're 10 years old and you have no idea what the video is about, you still want to watch to the end because it's just so fun and so exciting. Please create a v2 of it based on this feedback. You need to visually inspect your result and find the gap between what I described and what you currently have.", "translation": "我想让你从视觉上检查你的结果。我想让你检查它的节奏、它的速度、一切，并寻找改进的方法。请记住，目标是让它更激动人心、更具活力、更适合社交媒体，这意味着可能需要更快的剪切，以及整体上更多细微的细节和更细微的打磨。\n\n当我看着它时，有些地方感觉有点慢。有些地方感觉有点无聊。我需要你让它兴奋程度提高 5 倍。想想使用也许 3JS，也许一些着色器，也许任何你需要的东西，或者一些能让它更激动人心、更具创意的东西。只是让它更有创意、更聪明、更有趣、更激动人心，这样即使你 10 岁而且完全不知道视频内容是什么，你还是想看到最后，因为它就是那么有趣、那么激动人心。请根据这个反馈创建一个 v2 版本。你需要从视觉上检查你的结果，并找出我描述的内容和你当前结果之间的差距。", "url": "https://x.com/kaolti/status/2103481696695755225", "lang": "en", "note": ""}], "id": 15}, {"group": "图像与视频创作", "name": "15 秒动态设计作品集", "author": "ajith_io", "url": "https://x.com/ajith_io/status/2103449416325890146", "use": "快速探索 motion graphics 展示片。", "detail": "让模型把自己当作动态设计师，制作可用于作品集的 15 秒展示视频。作者回复还给出 40 秒产品介绍与按参考视频做 30 秒片子的变体。", "note": "", "prompts": [{"title": "15 秒动态图形作品集", "original": "make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a résumé. go all out.", "translation": "制作一个动态的 15 秒动态图形视频，展示你作为一个令人惊叹的动态设计师的才华，就像这是你简历的展示卷一样。全力以赴。", "url": "https://x.com/ajith_io/status/2103449416325890146", "lang": "en", "note": ""}], "id": 16}, {"group": "图像与视频创作", "name": "用 JS 做 Transformer 科普视频", "author": "dotey", "url": "https://x.com/dotey/status/2103683057689522564", "use": "把技术知识做成高中生也能看懂的视频。", "detail": "兼顾总体解释和注意力机制、数学等细节，允许检索及选择工具。作者回复提到 Remotion、KaTeX 与语音工具，并给出 DINOv3 同类变体。", "note": "", "prompts": [{"title": "Transformer 科普视频", "original": "帮我用js制作一个视频，主题是：什么是 Transformer\n要深入浅出，让高中生也能看得懂，不仅high level说的清楚，也要有细节，包括注意力机制，甚至一些数学概念\n\n你可以用任何工具或者安装工具，可以联网检索\n\n请给我惊喜", "translation": "", "url": "https://x.com/dotey/status/2103683057689522564", "lang": "zh", "note": ""}], "id": 17}, {"group": "图像与视频创作", "name": "餐馆时间冻结＋倒带", "author": "techhalla", "url": "https://x.com/techhalla/status/2083389002552664385", "use": "生成带连续叙事、子弹时间与逆转效果的电影短片。", "detail": "30 秒分段：餐馆日常、碰撞、冻结环绕、世界倒带、避开碰撞、人物特写；同时约束角色、液体、光线与胶片质感。", "note": "", "prompts": [{"title": "时间冻结与倒带：30 秒", "original": "Photorealistic cinematic 1950s American diner, chrome stools, red vinyl, neon glow and checkerboard floor, shot with modern lived-in realism and soft natural window light. Subtle handheld texture, warm practicals, rich period detail, heavy film grain.\n\n0-4s: [Medium Wide] A striking young woman in her early 20s sits alone at the counter, calm and slightly amused, slowly sipping a tall thick milkshake through a straw. Behind her a young waitress in classic uniform approaches with a tray of eggs and bacon in one hand and a full glass coffee pot in the other. An older lady starts rising from a nearby booth.\n\n4-8s: [Dynamic Tracking] The older lady collides hard into the waitress. Tray, plate, eggs, bacon and coffee pot explode upward in chaotic slow motion. Coffee erupts into long liquid ribbons and perfect suspended droplets. Camera immediately begins a smooth continuous orbit around the impact. Time locks completely at the peak of the spill. Every face freezes in pure shock. Only the girl at the counter keeps moving, completely unfazed.\n\n8-17s: [Slow 360° Orbital] Camera glides in a full elegant orbit through the frozen diner. Coffee hangs in mid-air as glassy ribbons and spheres with perfect volume and surface tension. Bacon strips, eggs and the spinning tray float weightlessly. Patrons and waitress remain locked in startled expressions. The girl at the counter takes one slow, deliberate sip, eyes half-lidded, almost bored, while the entire frozen world (except her) begins an elegant reverse: every droplet, every piece of food and every person rewinds smoothly back to the exact starting positions.\n\n17-24s: [Medium Shot] Rewind lands perfectly. Waitress stands balanced again with tray and coffee pot. The girl lifts her eyes, raises two fingers in a small casual gesture and softly calls the waitress by name. The waitress turns toward her just before the older lady begins to stand, completely avoiding the collision. A tiny private smile crosses the girl’s face.\n\n24-30s: [Extreme Close-Up] Hard cut to her face as she takes one last slow sip. Soft knowing smile, eyes almost closed in quiet satisfaction, like she has done this a hundred times. Shallow depth of field, creamy bokeh of the neon diner behind her.\n\nPhotorealistic, ultra-detailed fluid physics, perfect motion blur only on moving elements, stable characters, cinematic lighting, heavy natural film grain, no artifacts, movie-level temporal coherence, high rewatch value.", "translation": "照片级真实感的电影化 1950 年代美国餐馆，铬合金凳子，红色人造革，霓虹灯光和棋盘格地板，以现代生活化的真实感和柔和自然窗光拍摄。细微的手持质感，温暖的实用光源，丰富的时代细节，浓重的胶片颗粒。\n\n0-4 秒：[中广角] 一位引人注目的 20 岁出头年轻女子独自坐在柜台前，神情平静略带一丝愉悦，慢慢通过吸管啜饮一杯高而浓稠的奶昔。她身后，一位身穿经典制服的年轻女服务员手持一盘鸡蛋和培根，另一手拿着满满一壶咖啡，正走近过来。一位年长女士开始从附近的卡座站起。\n\n4-8 秒：[动态跟踪] 年长女士猛地撞上女服务员。托盘、盘子、鸡蛋、培根和咖啡壶在混乱的慢动作中向上爆裂。咖啡喷涌成长长的液体丝带和完美悬浮的液滴。镜头立即开始围绕撞击点平滑连续环绕。时间在倾洒的高峰完全锁定。每张脸都凝固在纯粹的震惊中。只有柜台边的女孩继续动着，完全不为所动。\n\n8-17 秒：[慢速 360° 环绕] 镜头在冻结的餐馆中优雅地完成完整环绕。咖啡悬浮在半空，形成玻璃般的丝带和球体，体积和表面张力完美无缺。培根条、鸡蛋和旋转的托盘无重力般漂浮。顾客和服务员仍锁定在惊愕的表情中。柜台边的女孩慢慢、有意地啜饮一口，眼睑半垂，几乎有些无聊，而整个冻结的世界（除她之外）开始优雅倒带：每一滴液体、每一块食物和每个人都平滑回溯到确切的起始位置。\n\n17-24 秒：[中景] 倒带完美落地。女服务员重新站稳，手持托盘和咖啡壶。女孩抬起眼睛，举起两根手指做一个随意的小手势，轻声呼唤服务员的名字。服务员刚好在年长女士起身前转向她，完全避开了碰撞。一丝细微的私人微笑掠过女孩的脸庞。\n\n24-30 秒：[极近景] 硬切到她的脸庞，她做最后一次缓慢啜饮。柔和的知晓微笑，眼睛几乎闭上，带着安静的满足，仿佛她已做过这事一百次。浅景深，身后霓虹餐馆呈奶油般的散景。\n\n照片级真实感，超详细的流体物理，仅在运动元素上完美的运动模糊，稳定的角色，电影化灯光，浓重的自然胶片颗粒，无瑕疵，电影级的时序连贯性，高重看价值。", "url": "https://x.com/techhalla/status/2083389002552664385", "lang": "en", "note": ""}], "id": 18}, {"group": "图像与视频创作", "name": "一张人物图生成 20 格电影分镜", "author": "teach_fireworks", "url": "https://x.com/teach_fireworks/status/1994701333224669364", "use": "将角色参考图转化为完整短片的分镜接触表。", "detail": "4×5 网格，共 20 帧，每格代表 5 秒；替换角色、影片风格、剧情方向；要求人物一致、叙事推进、时间码与总图比例。", "note": "它首先生成分镜图，并非直接交付 100 秒视频。", "prompts": [{"title": "20 格电影分镜接触表", "original": "A 4K resolution contact sheet showing a 4x5 grid of twenty individual film frames, acting as a storyboard for a 100-second short film sequence.\n\n**[Subject & Actor]**\nThe main character in all frames is [⭐在此处写上使用上传的图片人物], maintaining their likeness throughout.\n\n**[Film Style & Texture]**\nThe entire grid must perfectly mimic the specific cinematography, film grain, lighting, color grading, and atmosphere of the movie [⭐在此处替换电影名称或风格，例如：《银翼杀手2049》的赛博朋克霓虹光影风格⭐].\n\n**[Sequence Progression]**\nThe 20 frames should show a clear narrative progression typical of this genre (e.g., buildup, conflict, climax, resolution). Each frame represents a 5-second interval step in the story.\n* **Optional Story Guidance (delete if not needed):** [⭐(可选)在此处添加特定的剧情走向描述，例如：从平静交谈演变为激烈争吵，最后一人愤怒离开⭐]\n\n**[Details]**\nInclude sequential timecodes burned into the bottom corner of each frame (e.g., 00:00:05, 00:00:10, ... up to 01:40). The aspect ratio of the final combined image should be 4:5.", "translation": "一张 4K 分辨率的接触表，以 4×5 网格展示二十个独立电影画面，作为一段 100 秒短片的分镜。\n\n**[主体与演员]**\n所有画面的主角为 [⭐在此处写上使用上传的图片人物]，在各画面中保持人物样貌一致。\n\n**[电影风格与质感]**\n整张网格应准确呈现电影 [⭐在此处替换电影名称或风格，例如：《银翼杀手2049》的赛博朋克霓虹光影风格⭐] 的摄影、胶片颗粒、光线、调色与氛围。\n\n**[序列推进]**\n20 个画面应体现该类型故事清晰的叙事推进，例如铺垫、冲突、高潮与收束。每格代表故事中间隔 5 秒的一个节点。\n* **可选剧情引导（不需要时删除）：** [⭐(可选)在此处添加特定的剧情走向描述，例如：从平静交谈演变为激烈争吵，最后一人愤怒离开⭐]\n\n**[细节]**\n每格底部角落印上连续时间码，例如 00:00:05、00:00:10，直至 01:40。最终合成图宽高比为 4:5。", "url": "https://x.com/teach_fireworks/status/1994701333224669364", "lang": "en", "note": ""}], "id": 19}, {"group": "图像与视频创作", "name": "蒙娜丽莎 vs 维纳斯格斗视频", "author": "ivanka_humeniuk", "url": "https://x.com/ivanka_humeniuk/status/2059105268760244713", "use": "制作带游戏 HUD 的名画角色对战短片。", "detail": "用参考图作首帧，设定左右角色、血条、招式、竞技场、分镜时间、镜头运动和战斗结局。", "note": "属于视频生成 prompt，不是可玩的格斗游戏。", "prompts": [{"title": "第一回合：名画角色对战", "original": "Round 1: \nUse image1 as opening frame — MONA LISA left, VENUS right. Full HUD: yellow health bar left, green right, portraits, names, ROUND 1 center, SUPER bars bottom. Arena: A dark Renaissance cathedral merging with a stormy ocean shore. Photorealistic cinematic. Mortal Kombat style. HUD reacts every action. CHARACTERS: - MONA LISA (left): Dark silk robes, enigmatic smile, uses smoke-like \"Sfumato\" magic. - VENUS (right): Wrapped in elegant flowing beige silk drapery, golden hair, uses water and pearl magic.\nSHOT 1 (00:00–00:01) — ROUND 1 Start. \"ROUND 1\" gothic gold text. Voice: \"ROUND ONE. FIGHT!\" Camera rockets in.\nSHOT 2 (00:01–00:04) — DIRECT COMBAT. MONA LISA vanishes in dark smoke, reappears behind VENUS, striking with a hidden wooden dagger (Da Vinci design). VENUS blocks with a giant pearl shell — sparks and water spray. VENUS counter: a massive water whip slash — MONA LISA ducks, ground cracks. Camera 360° orbit. SLOW MOTION 20% on impacts — black oil paint and sea foam spraying outward.\nSHOT 3 (00:04–00:07) — SPECIAL ABILITIES. MONA LISA summons a wooden Da Vinci tank that fires a heavy bolt — VENUS backflips over it, landing on a wave. VENUS calls the Zephyr winds — a tornado of pink rose petals and wind blasts MONA LISA backward. Camera ECU: petals clashing with dark oil smoke. Bars dropping.\nSHOT 4 (00:07–00:10) — TITAN CLASH. MONA LISA summons a GIGANTIC SKELETAL HAND made of dry cracked oil paint. VENUS summons a MASSIVE TIDAL WAVE shaped like a goddess. SLOW MOTION 15%: both titans charge. MASSIVE COLLISION center screen. Camera RUSHES into explosion of black paint and blue water.\nSHOT 5 (00:13–00:15) — EPIC DRAW. Both slammed into opposite pillars. Smoke and mist everywhere. Camera slow orbit. Both bars empty. FREEZE FRAME. \"EPIC DRAW\" burns center. Hard cut black.", "translation": "第1回合：  \n使用image1作为开场画面 — 蒙娜丽莎左侧，维纳斯右侧。完整HUD：左侧黄色生命条，右侧绿色生命条，肖像，姓名，ROUND 1置于中心，超级条置于底部。竞技场：一座黑暗的文艺复兴大教堂与暴风雨海洋海岸融合。照片级真实电影风格。真人快打风格。HUD对每个动作做出反应。角色： - 蒙娜丽莎（左侧）：深色丝绸长袍，神秘微笑，使用烟雾般的“晕涂法”魔法。 - 维纳斯（右侧）：裹着优雅飘逸的米色丝绸衣褶，金色头发，使用水与珍珠魔法。  \n镜头1（00:00–00:01） — 第1回合开始。“ROUND 1”哥特金色文字。配音：“第一回合。战斗！”镜头急速推进。  \n镜头2（00:01–00:04） — 直接战斗。蒙娜丽莎在黑暗烟雾中消失，重新出现在维纳斯身后，用一把隐藏的木制匕首（达芬奇设计）刺击。维纳斯用巨型珍珠贝壳格挡 — 火花四溅，水花喷射。维纳斯反击：巨型水鞭猛砍 — 蒙娜丽莎闪避，地面龟裂。镜头360°环绕。撞击时慢动作20% — 黑色油画颜料与海沫向外喷溅。  \n镜头3（00:04–00:07） — 特殊能力。蒙娜丽莎召唤一辆木制达芬奇坦克，发射重型弩箭 — 维纳斯后空翻跃过它，落在浪头上。维纳斯召唤西风 — 粉色玫瑰花瓣的龙卷风与狂风将蒙娜丽莎向后击飞。镜头特写：花瓣与黑暗油烟碰撞。能量条下降。  \n镜头4（00:07–00:10） — 泰坦对决。蒙娜丽莎召唤一只由干裂油画颜料构成的巨大骷髅手。维纳斯召唤一座女神形状的巨型潮汐波。慢动作15%：两尊泰坦冲锋。屏幕中央发生剧烈碰撞。镜头冲入黑色颜料与蓝色水的爆炸中。  \n镜头5（00:13–00:15） — 史诗平局。两者被猛撞到对面柱子上。到处是烟雾和水雾。镜头缓慢环绕。两者能量条清空。定格画面。“史诗平局”在中心燃烧。硬切黑屏。", "url": "https://x.com/ivanka_humeniuk/status/2059105268760244713", "lang": "en", "note": ""}], "id": 20}, {"group": "图像与视频创作", "name": "Seedance 运镜提示词指南", "author": "yanhua1010", "url": "https://x.com/yanhua1010/status/2022115319603753075", "use": "从普通场景描述提升为明确的镜头设计。", "detail": "按景别、主体、动作、运镜、光影、风格、画质、稳定约束组织提示；包含人像、风景、图生视频、森林和赛博城市模板。", "note": "文章中的效果百分比属于作者说法，本整理不作为实测结论。", "prompts": [{"title": "唯美人像", "original": "一位年轻女生在林间缓慢行走，微风轻拂头发，自然微笑，暖光光影，中景，缓慢推镜，画面流畅稳定，4K高清，电影感，面部清晰不变形，人体结构正常，细节丰富。", "translation": "", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "zh", "note": ""}, {"title": "氛围风景", "original": "海边日落，海浪轻拍沙滩，镜头缓慢横移，暖橙色调，治愈清新，画面丝滑，4K超高清，无闪烁无重影。", "translation": "", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "zh", "note": ""}, {"title": "图生视频首帧固定", "original": "基于参考图保持人物样貌与服装一致，动作缓慢抬手转身，自然流畅，不僵硬不变形，稳定运镜，高清细节，电影质感。", "translation": "", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "zh", "note": ""}, {"title": "通用结构", "original": "[景别] + [主体描述] + [动作（慢、连续、具体）] + [运镜指令（1-2 个组合）] + [光影氛围] + [风格标签] + [画质标签] + [稳定性约束]", "translation": "", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "zh", "note": ""}, {"title": "通用结构填空示例", "original": "[中景] + [一位身穿白裙的年轻女生] + [在花海中缓慢旋转，裙摆随风展开] + [缓慢环绕半圈 + 轻微推镜] + [黄昏暖光，逆光剪影] + [唯美文艺，日系清新] + [4K超高清，细节丰富] + [画面稳定不抖动，面部清晰不变形]", "translation": "", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "zh", "note": ""}, {"title": "森林中的鹿", "original": "A majestic deer slowly turning its head in ancient misty forest, Subtle Arc Shot 90 degrees + Gradual Zoom In on eyes, ethereal god rays, photorealistic 8K, dreamy atmosphere.", "translation": "一只雄伟的鹿在古老的雾林中缓缓转头，镜头轻柔地沿弧线环绕 90 度，并逐渐推近眼睛；空灵的丁达尔光线，照片级 8K 质感，梦幻氛围。", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "en", "note": ""}, {"title": "赛博朋克城市", "original": "Futuristic neon city at night, Aerial Crane Down from skyscrapers to street level + Slow Pan Right, bustling traffic light trails, cyberpunk aesthetic, rain-soaked streets reflecting lights.", "translation": "未来霓虹城市的夜景，从摩天大楼向街道进行航拍下降，并缓慢向右摇镜；繁忙车流留下光轨，赛博朋克美学，被雨浸湿的街道倒映灯光。", "url": "https://x.com/yanhua1010/status/2022115319603753075", "lang": "en", "note": ""}], "id": 21}, {"group": "图像与视频创作", "name": "艺术家风格对照测试", "author": "vista8", "url": "https://x.com/vista8/status/2058021035715531218", "use": "固定场景，只替换艺术家，比较模型对风格的表现。", "detail": "以窗边读书的女子、猫和花园作为共同场景，替换 artist 变量，避免题材差异干扰比较。", "note": "", "prompts": [{"title": "固定场景对照艺术家风格", "original": "一个女子坐在窗边读书，一只猫趴在她腿上，窗外是花园，用{artist}的风格绘制。", "translation": "", "url": "https://x.com/vista8/status/2058021035715531218", "lang": "zh", "note": ""}], "id": 22}, {"group": "图像与视频创作", "name": "手绘无人机路线生成镜头", "author": "GoogleAI", "url": "https://x.com/GoogleAI/status/2060156790642299029", "use": "用草图表达想要的航拍路线。", "detail": "收藏帖引用的做法：上传手绘相机路径，要求视频模型生成对应的无人机视角镜头。", "note": "原帖是简短的用法示例，未提供复杂的完整模板。", "prompts": [{"title": "无人机路径指令", "original": "Draw a path that a drone can follow", "translation": "绘制一条无人机可以跟随的路径", "url": "https://x.com/GoogleAI/status/2060156790642299029", "lang": "en", "note": "原帖只给出这一句简短指令；需配合手绘路线参考图，不是长模板。"}], "id": 23}, {"group": "学习、研究与表达", "name": "多种格式解释同一知识", "author": "karpathy", "url": "https://x.com/karpathy/status/2105819303471976479", "use": "把难懂的模型输出转换为更容易理解的形式。", "detail": "四种方向：按 ASD-STE100 或较宽松版本改写；生成图表；生成交互 HTML；为主题制作类似 3b1b 的讲解视频并配旁白。", "note": "这些是输出形式提示，不是单一长模板。", "prompts": [{"title": "3b1b 风格讲解视频", "original": "Create a 3b1b style video explainer on X. Use my ElevenLabs API key for audio narration", "translation": "为 X 制作一段 3b1b 风格的讲解视频。使用我的 ElevenLabs API 密钥进行旁白配音。", "url": "https://x.com/karpathy/status/2105819303471976479", "lang": "en", "note": ""}, {"title": "清晰写作", "original": "80% of the way to ASD-STE100", "translation": "达到 ASD-STE100 规范的 80% 程度。", "url": "https://x.com/karpathy/status/2105819303471976479", "lang": "en", "note": "原帖中的短指令片段，需要与具体解释主题一起使用。"}, {"title": "交互网页", "original": "in HTML", "translation": "以 HTML 形式输出。", "url": "https://x.com/karpathy/status/2105819303471976479", "lang": "en", "note": "原帖中的短指令片段，需要与具体解释主题一起使用。"}, {"title": "图表解释", "original": "ask your LLM to create a diagram", "translation": "请让你的大语言模型创建一张图表。", "url": "https://x.com/karpathy/status/2105819303471976479", "lang": "en", "note": "原帖中的短指令片段，需要与具体解释主题一起使用。"}], "id": 24}, {"group": "学习、研究与表达", "name": "NotebookLM 的 10 个提示", "author": "FinanceYF5", "url": "https://x.com/FinanceYF5/status/2011633164897436021", "use": "将已有资料转成问题、洞察、播客、决策备忘录或文献综述。", "detail": "10 条子项分别覆盖核心问题、课堂提纲、趣味信息、定向洞察、测验播客、多语言播客、产品经理、科研人员、教师、文献综述。见下表。", "note": "内容来自收藏作者的转述；“Google 官方”等来源标签未另作外部核验。", "prompts": [{"title": "五个核心问题", "original": "分析所有条目，并生成 5 个核心问题。只要回答这 5 个问题，就能涵盖所有条目的主要观点和核心含义。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633176826036427", "lang": "zh", "note": ""}, {"title": "终极课堂", "original": "回顾所有已上传的材料，并生成 5 个核心问题，用来概括其中心思想。\n\n重点关注：\n\n基础主题和定义、被重点强调的关键概念、概念之间的关系、提到的实际应用场景", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633188586864932", "lang": "zh", "note": ""}, {"title": "有趣信息", "original": "这些来源中最令人惊讶或最有趣的数据是什么？请包含关键引用。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633200226083321", "lang": "zh", "note": ""}, {"title": "定向洞察", "original": "我对写 [TOPIC] 这个主题很感兴趣。  在这些资料中，与 [TOPIC] 相关的最令人惊讶的数据或洞察是什么？  请包含关键引用。重点关注 [SPECIFIC ASPECT]，而不是 [OTHER ASPECTS]。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633211953332249", "lang": "zh", "note": ""}, {"title": "测验播客", "original": "一个由两位主持人进行的测验。第一位向第二位提问关于 [TOPIC] 的问题，共 10 题，包含选择题和判断题。\n\n主持人有时会答错，另一位给出正确答案并纠正。最后汇总结果。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633223659638856", "lang": "zh", "note": ""}, {"title": "多语言播客", "original": "这是 Deep Dive 的第一期国际特别节目，全程使用 [language] 完成。\n\n特别说明：\n\n全程只使用 [language]\n\n不允许使用英语，除非为了澄清特定术语。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633235642761695", "lang": "zh", "note": ""}, {"title": "产品经理角色", "original": "以资深产品经理身份审阅内部文档，精准抓取可执行洞察，忽略废话\n\n以‘决策备忘录’格式综合输出\n\n用户证据：直接引用体现用户问题的原话\n可行性检查：文中提到的技术限制\n盲点：原文缺失的内容\n\n使用要点列表。如果我问得很模糊，强制澄清", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633247399379152", "lang": "zh", "note": ""}, {"title": "科研助理角色", "original": "以资深科学家研究助理身份输出，语气客观、正式、精准。\n假设具备 [FIELD] 高级背景，不解释常规术语。\n聚焦方法论、数据完整性、矛盾证据。\n优先样本量、实验设计、统计显著性。\n\n输出结构：\n\n关键发现\n方法学优势/不足\n矛盾之处", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633258971480536", "lang": "zh", "note": ""}, {"title": "教师角色", "original": "以一位有感染力的高中老师身份行事，把原始文档翻译成七年级学生也能懂的语言。\n\n每次输出结构：\n\n一句话 tl;dr\n一个生活化类比\n3 个难词的简单解释\n复杂段落改成判断题（true/false）", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633270761668688", "lang": "zh", "note": ""}, {"title": "文献综述", "original": "从关于 [TOPIC] 的文章中，找出最反复出现的 5–10 个主题。\n\n对每个主题提供：\n\n用你自己的话简要定义\n哪些文章提到它（带引用）\n一句话说明它是如何被讨论的（争议、默认、已证实等）\n\n以结构化表格形式呈现。", "translation": "", "url": "https://x.com/FinanceYF5/status/2011633282321170615", "lang": "zh", "note": ""}], "id": 25}, {"group": "设备与历史排障", "name": "Android 减少广告与打扰", "author": "HiTw93", "url": "https://x.com/HiTw93/status/2113975366469767426", "use": "通过电脑连接手机或平板后，逐项优化广告、通知、图标和预装应用。", "detail": "先识别设备，保留有用通知和系统基础服务；停用优先于卸载，桌面先给方案；每项修改后验证，最后报告完成、保留与未完成事项。", "note": "", "prompts": [{"title": "Android 广告与打扰优化", "original": "请通过电脑连接我的安卓手机或平板，识别品牌、系统版本和已安装应用，帮我做一次减少广告和打扰的优化。\n\n1. 关闭广告和推广\n检查系统及应用中能关闭的广告跟踪、个性化广告、内容推荐、热点资讯、营销优惠、福利活动和功能推广，包括负一屏、系统搜索、锁屏、浏览器、应用商店等入口。\n\n2. 保留有用的通知\n优先按通知分类关闭推广，保留聊天、邮件、订单物流、支付、账户安全、日历、天气预警、系统更新，以及 AI 回复和任务完成提醒。不要一刀切关闭整个应用的通知，用途不明确的先保留，原本关闭的不要擅自开启。\n\n3. 更换营销图标\n把带促销文字、节日或周年装饰的图标换成干净的经典图标，例如淘宝、京东、拼多多、哔哩哔哩。优先使用系统自带的图标设置，OPPO/ColorOS 可以检查「设置 > 桌面、锁屏与个性化 > 图标 > ART+ 图标」。其他品牌先核实支持情况，不盲目安装图标包或更换桌面启动器。\n\n4. 精简系统设置和预装应用\n关闭不需要的推广入口和使用体验计划。盘点预装应用，对明确不需要、可安全停用且能够恢复的应用优先停用；卸载前列出名称和影响让我确认。不要仅凭近期没使用就删除，不要动系统桌面、更新、安全、安装器、账户、备份和设备互联等基础服务。\n\n5. 整理桌面\n参考近期使用情况，建议哪些应用留在首页或底栏，哪些归入购物、工具、影音等文件夹。先给具体排列方案，确认后再移动。\n\n可以直接执行明确、可恢复的广告和通知设置调整。不要清除应用数据或改动代理、网络设置。每项修改后验证是否生效，最后简要列出已修改、保留和无法处理的项目，不把关闭广告跟踪说成去除了所有广告。", "translation": "", "url": "https://x.com/HiTw93/status/2113975366469767426", "lang": "zh", "note": ""}], "id": 26}, {"group": "设备与历史排障", "name": "Codex TRACE 日志写盘排查", "author": "Hicker_Moledao", "url": "https://x.com/Hicker_Moledao/status/2069111296910671960", "use": "检查特定日志数据库是否存在异常持续写入。", "detail": "原帖有诊断与止损两段：检查日志写入；若确认异常，备份后处理触发器和 WAL，再采样观察。", "note": "历史排障资料：原帖回复称问题当时已修复。这不是当前机器存在问题的证据，也不建议原样执行数据库修改。", "prompts": [{"title": "检测高频 TRACE 写盘", "original": "帮我检测 ~/.codex/logs_2.sqlite 是否因 TRACE 日志持续高频写盘？", "translation": "", "url": "https://x.com/Hicker_Moledao/status/2069111296910671960", "lang": "zh", "note": ""}, {"title": "确认异常后的止损操作", "original": "中招了就直接先备份，再用 SQLite trigger 拦截 logs 表, 并 checkpoint/truncate WAL,最后采样确认 MAX(id) 和 WAL 不再增长", "translation": "", "url": "https://x.com/Hicker_Moledao/status/2069111296910671960", "lang": "zh", "note": ""}], "id": 27}]</script>
<script>
'use strict';
const library=JSON.parse(document.getElementById('library-data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=Number(location.hash.replace('#group-',''))||1,mode='both',filtered=library,lastCopyButton=null;const copyIcon='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="6" y="6" width="9" height="10" rx="1.5"></rect><path d="M12 6V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3"></path></svg>';
[...new Set(library.map(g=>g.group))].forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent=g;$('#category').append(o)});
function filter(){const q=$('#search').value.trim().toLocaleLowerCase(),cat=$('#category').value;filtered=library.filter(g=>(cat==='all'||g.group===cat)&&[g.name,g.use,g.author,g.group,...g.prompts.flatMap(p=>[p.title,p.original,p.translation])].join('\n').toLocaleLowerCase().includes(q));if(!filtered.some(g=>g.id===selected))selected=filtered[0]?.id??null;renderNav();renderReader();}
function renderNav(){
  $('#result-count').textContent=filtered.length+' 组';
  $('#navlist').innerHTML=filtered.length?filtered.map(g=>`<button class="navitem" data-select="${g.id}" aria-current="${selected===g.id}"><strong>${esc(g.name)}</strong>${g.prompts.length>1&&!g.name.includes(String(g.prompts.length))?`<span class="nav-count" aria-label="${g.prompts.length} 条提示">${g.prompts.length} 条</span>`:''}</button>`).join(''):'<div class="empty">无匹配结果</div>';
}
function version(p,index,translation){
  const txt=translation?p.translation:p.original,label=translation?'中文译文':({en:'英文原文',ja:'日文原文',zh:'原文'}[p.lang]||'原文');
  const caption=translation?'中文':({en:'English',ja:'日本語',zh:''}[p.lang]||'');
  return `<section class="version ${translation?'translation':''}"><div class="vbar">${caption?`<span class="lang">${caption}</span>`:'<span></span>'}<button class="copy" data-copy="${index}" data-version="${translation?'translation':'original'}" aria-label="复制${label}：${esc(p.title)}">${copyIcon}<span>复制</span></button></div><pre class="text" lang="${translation?'zh':p.lang}">${esc(txt)}</pre></section>`;
}
function renderReader(){
  const g=library.find(g=>g.id===selected);
  if(!g){$('#reader').innerHTML='<div class="empty"><strong>无匹配结果</strong><button class="reset" id="reset">清除筛选</button></div>';return}
  const pos=filtered.findIndex(x=>x.id===g.id),hasTranslation=g.prompts.some(p=>p.translation);
  const notes=[g.id!==27?g.note:'',...new Set(g.prompts.map(p=>p.note).filter(Boolean))].filter(Boolean);
  const uiTitles=['文案分隔','删去冗余说明','文案审查','配色体系','对齐与圆角','边框','动效','字号','信息优先级','圆角与阴影'];
  $('#reader').innerHTML=`<div class="readerhead"><h2>${esc(g.name)}</h2><a class="source" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer" aria-label="查看 @${esc(g.author)} 的原帖">@${esc(g.author)} ↗</a></div><p class="purpose">${esc(g.use)}</p>${g.id===27?`<p class="note">${esc(g.note)}</p>`:''}${hasTranslation?`<div class="reader-tools"><div class="segmented" role="group" aria-label="显示语言">${[['both','对照'],['original','原文'],['translation','中文']].map(([v,l])=>`<button data-mode="${v}" aria-pressed="${mode===v}">${l}</button>`).join('')}</div></div>`:''}<div class="prompts">${g.prompts.map((p,i)=>{
    const parts=[];if(mode!=='translation'||!p.translation)parts.push(version(p,i,false));if(p.translation&&mode!=='original')parts.push(version(p,i,true));
    return `<article class="prompt">${g.prompts.length>1?`<header class="prompt-head"><h3>${esc(g.id===2?uiTitles[i]:p.title)}</h3>${p.url!==g.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="查看原帖：${esc(p.title)}">原帖 ↗</a>`:''}</header>`:''}<div class="versions ${parts.length===1?'single':''}">${parts.join('')}</div></article>`;
  }).join('')}</div>${notes.length?`<details class="context"><summary>使用备注</summary>${notes.map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}<div class="pager"><button data-step="-1" ${pos===0?'disabled':''}>← ${pos>0?esc(filtered[pos-1].name):'上一组'}</button><button data-step="1" ${pos===filtered.length-1?'disabled':''}>${pos<filtered.length-1?esc(filtered[pos+1].name):'下一组'} →</button></div><footer class="sitefoot"><details><summary>关于收藏册</summary><p>27 组收藏，71 条提示词，28 份中文译文。<br>来自 @holy_game_ai 的 X 收藏，2026 年 11 月 8 日核对。<br>原文保留作者措辞与占位符；模型名称、接口和配置沿用原帖记录。短指令需配合具体主题或参考材料。</p></details></footer>`;
}
function choose(id,scroll=true){selected=id;history.replaceState(null,'','#group-'+id);renderNav();renderReader();if(scroll){$('#reader').scrollIntoView({block:'start',behavior:'instant'});$('#reader').focus({preventScroll:true})}$('.sidebar').classList.remove('open');$('#mobile-toggle').setAttribute('aria-expanded','false');$('#mobile-toggle').innerHTML='<span>目录</span><span aria-hidden="true">⌄</span>';}
function toast(message){$('#toast').textContent=message;}
async function copy(text,button){lastCopyButton=button;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}if(ok){button.classList.add('done');button.querySelector('span').textContent='已复制';toast('已复制到剪贴板');setTimeout(()=>{if(button.isConnected){button.classList.remove('done');button.querySelector('span').textContent='复制'}},1800);button.focus()}else{$('#manual').hidden=false;$('#manual-text').value=text;$('#manual-text').focus();$('#manual-text').select()}}
$('#search').addEventListener('input',filter);$('#category').addEventListener('change',filter);$('#mobile-toggle').addEventListener('click',()=>{const open=$('.sidebar').classList.toggle('open');$('#mobile-toggle').setAttribute('aria-expanded',String(open));$('#mobile-toggle').innerHTML=`<span>目录</span><span aria-hidden="true">${open?'⌃':'⌄'}</span>`});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select)choose(Number(b.dataset.select));if(b.dataset.mode){mode=b.dataset.mode;renderReader()}if(b.dataset.copy!==undefined){const p=library.find(g=>g.id===selected).prompts[Number(b.dataset.copy)];copy(p[b.dataset.version],b)}if(b.dataset.step){const index=filtered.findIndex(g=>g.id===selected)+Number(b.dataset.step);if(filtered[index])choose(filtered[index].id)}if(b.id==='reset'){$('#search').value='';$('#category').value='all';filter()}});function closeManual(){$('#manual').hidden=true;lastCopyButton?.focus()}$('#close-manual').addEventListener('click',closeManual);document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){if(!$('#manual').hidden)closeManual();else if(document.activeElement===$('#search')){$('#search').value='';filter()}}if(!$('#manual').hidden&&e.key==='Tab'){e.preventDefault();document.activeElement===$('#manual-text')?$('#close-manual').focus():$('#manual-text').focus()}});window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#group-',''));if(library.some(g=>g.id===n)){selected=n;renderNav();renderReader()}});filter();
</script>
</body></html>
