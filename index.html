<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>holynova · Where Craft Lives | 作品集 Detail 视觉版</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Analytics -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
    data-domains="holynova.github.io"
    data-exclude-search="true"
    data-exclude-hash="true"
  ></script>

  <!-- Detail Design System & Cards CSS -->
  <link rel="stylesheet" href="css/detail-theme.css">
  <link rel="stylesheet" href="css/detail-cards.css">
</head>
<body>
  <!-- Ambient Spotlight Glow Background -->
  <div class="ambient-glow-layer" id="ambient-glow-layer"></div>

  <!-- Top Floating Header -->
  <header class="site-header">
    <div class="nav-left">
      <a href="./index.html" class="brand-pill" title="holynova portfolio" aria-label="holynova portfolio home">
        <img src="head.png" alt="holynova" class="brand-avatar" onerror="this.src='favicon.png'">
        <span class="brand-name">holynova</span>
        <span class="brand-badge-pulse">
          <span class="pulse-dot"></span>
          <span>168</span>
        </span>
      </a>
    </div>

    <div class="nav-right">
      <!-- Language Toggle -->
      <button class="nav-action-btn" id="lang-toggle-btn" type="button" title="Toggle Language">
        <span id="lang-label">EN</span>
      </button>

      <!-- Theme Toggle -->
      <button class="nav-action-btn" id="theme-toggle-btn" type="button" title="Toggle Dark/Light Mode">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon-svg"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
    </div>
  </header>

  <div class="site-wrapper">
    <!-- Hero Section (Clean, Confident, Anti-AI-Slop Typography) -->
    <section class="hero-section">
      <h1 class="hero-title" data-zh="small ideas, better products" data-en="small ideas, better products">
        small ideas, better products
      </h1>
      <p class="hero-subtitle" 
         data-zh="精选收录 84 个工程与设计项目，持续探索更好的产品。"
         data-en="A curated collection of 84 fine-crafted engineering & design projects shaping better products.">
        A curated collection of 84 fine-crafted engineering & design projects shaping better products.
      </p>
      <div class="hero-author-row">
        <span data-zh="精选自" data-en="Curated by">Curated by</span>
        <a href="https://github.com/holynova" target="_blank" rel="noopener noreferrer" class="author-sig-link">
          <img src="head.png" alt="holynova" style="width: 18px; height: 18px; border-radius: 50%;" onerror="this.style.display='none'">
          <span>holynova · 小桑</span>
        </a>
      </div>
    </section>

    <!-- Sticky Progressive Blur Toolbar -->
    <div class="sticky-toolbar-wrapper">
      <div class="progressive-blur-bg"></div>
      <div class="toolbar-container">
        <div class="toolbar-top-row">
          <!-- Search Box -->
          <div class="search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <label class="visually-hidden" for="search-input" data-zh="搜索项目" data-en="Search projects">搜索项目</label>
            <input type="text" class="search-input-field" id="search-input" 
                   placeholder="搜索项目、描述或语言（按 / 聚焦）…"
                   aria-describedby="results-summary"
                   autocomplete="off" spellcheck="false">
            <button class="search-clear-btn" id="search-clear-btn" type="button" aria-label="清除搜索" hidden>
              <span aria-hidden="true">×</span>
            </button>
            <span class="search-kbd-hint" id="search-kbd-hint">/</span>
          </div>

          <!-- Sort Menu (Simplified: Latest, Star, Alpha) -->
          <div class="toolbar-controls-right">
            <div class="sort-select-wrapper">
              <button class="sort-button" id="sort-dropdown-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="M11 4h4"></path><path d="M11 8h7"></path><path d="M11 12h10"></path></svg>
                <span id="sort-current-label">最新</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div class="sort-menu-dropdown" id="sort-menu" role="menu" aria-label="排序">
                <button class="sort-menu-item selected" type="button" role="menuitemradio" aria-checked="true" tabindex="0" data-sort="latest">
                  <span data-zh="最新" data-en="Latest">最新</span>
                  <span>↓</span>
                </button>
                <button class="sort-menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-sort="stars">
                  <span data-zh="Star" data-en="Star">Star</span>
                  <span>★</span>
                </button>
                <button class="sort-menu-item" type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-sort="alpha">
                  <span data-zh="字母顺序" data-en="Name A-Z">字母顺序</span>
                  <span>A-Z</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Category Pills Row -->
        <div class="category-pills-row" id="category-pills">
          <!-- Populated by detail-app.js -->
        </div>
      </div>
    </div>

    <div class="results-summary-row">
      <p class="results-summary" id="results-summary" role="status" aria-live="polite">显示 0 / 0 个项目</p>
      <button class="clear-filters-btn" id="clear-filters-btn" type="button" hidden>清除筛选</button>
    </div>

    <!-- Main Masonry Cards Grid -->
    <main>
      <div class="detail-masonry-grid" id="masonry-grid">
        <!-- Rendered dynamically in progressive batches by detail-app.js -->
      </div>
      <!-- Progressive Infinite Scroll Sentinel & Status Indicator -->
      <div class="scroll-sentinel" id="scroll-sentinel"></div>
      <div class="scroll-status-container" id="scroll-status" aria-live="polite"></div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div>© 2014-2026 holynova. Where craft lives.</div>
      <div class="footer-links">
        <a href="./classic.html" data-zh="极简经典版" data-en="Classic Archive">极简经典版</a>
        <a href="mailto:holy_nova@126.com">holy_nova@126.com</a>
        <a href="https://github.com/holynova" target="_blank" rel="noopener noreferrer">GitHub Profile</a>
        <a href="https://holynova.github.io/ai-coding-report/" target="_blank" rel="noopener noreferrer">AI Coding Wrapped</a>
      </div>
    </footer>
  </div>

  <!-- Static Data Store & Scripts -->
  <script src="js/detail-app.js?v=20260831-direct-links"></script>
</body>
</html>
