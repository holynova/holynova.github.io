        :root {
            --bg-page: #09090b;
            --bg-surface: #121215;
            --bg-surface-hover: #18181c;
            --bg-subtle: #1c1c22;
            --border-default: #27272a;
            --border-hover: #3f3f46;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-primary: #ffffff;
            --accent-link: #38bdf8;
            --badge-bg: #1c1c22;
            --badge-text: #d4d4d8;
            --badge-border: #27272a;
            --demo-badge-bg: rgba(56, 189, 248, 0.1);
            --demo-badge-text: #38bdf8;
            --demo-badge-border: rgba(56, 189, 248, 0.25);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        [data-theme="light"] {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f5f9;
            --bg-subtle: #f1f5f9;
            --border-default: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-primary: #0f172a;
            --accent-link: #0284c7;
            --badge-bg: #f1f5f9;
            --badge-text: #334155;
            --badge-border: #e2e8f0;
            --demo-badge-bg: rgba(2, 132, 199, 0.08);
            --demo-badge-text: #0284c7;
            --demo-badge-border: rgba(2, 132, 199, 0.2);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            line-height: 1.5;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* Header */
        header.site-header {
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border-default);
        }

        .header-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar {
            width: 44px;
            height: 44px;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .profile-text h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-text p {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-link-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .nav-link-btn:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .nav-link-btn.highlight {
            color: var(--accent-link);
            border-color: var(--demo-badge-border);
            background: var(--demo-badge-bg);
        }

        .nav-link-btn.highlight:hover {
            background: rgba(56, 189, 248, 0.18);
        }

        /* Search & Filter Bar */
        .controls-section {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 15px;
            padding: 10px 42px 10px 14px;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .search-shortcut {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .filters-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .cat-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cat-pill:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .cat-pill.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-page);
            font-weight: 600;
        }

        .results-count {
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 14px;
        }

        .project-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.15s ease, transform 0.12s ease, background-color 0.15s ease;
            position: relative;
        }

        .project-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .project-title {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.4;
            word-break: break-word;
        }

        .project-title:hover {
            color: var(--accent-link);
        }

        .header-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .demo-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 5px;
            background: var(--demo-badge-bg);
            color: var(--demo-badge-text);
            border: 1px solid var(--demo-badge-border);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s ease;
        }

        .demo-badge:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .star-badge {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--badge-bg);
            color: var(--text-secondary);
            border: 1px solid var(--badge-border);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .project-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] .card-footer {
            border-top-color: rgba(0, 0, 0, 0.05);
        }

        .lang-pill {
            font-size: 12px;
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
        }

        .card-date {
            color: var(--text-muted);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Category Section Divider in Full View */
        .category-block {
            margin-bottom: 40px;
        }

        .category-title-bar {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-default);
        }

        .category-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-count {
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Footer */
        footer.site-footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 12px;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 16px;
        }

        footer a:hover {
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px 60px;
            }
            .header-top {
                flex-direction: column;
                gap: 16px;
            }
            .header-actions {
                width: 100%;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .filters-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

        let currentLang = localStorage.getItem('holynova_lang') || 'zh';
        let activeCategory = 'all';
        let currentTheme = localStorage.getItem('holynova_theme') || 'dark';

        // Apply theme
        document.documentElement.setAttribute('data-theme', currentTheme);

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('holynova_theme', currentTheme);
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('holynova_lang', currentLang);
            updateLangUI();
            renderCategories();
            handleSearch();
        }

        function updateLangUI() {
            const langBtn = document.getElementById('lang-btn');
            langBtn.innerText = currentLang === 'zh' ? 'EN' : '中文';

            const bio = document.getElementById('bio-text');
            bio.innerText = bio.getAttribute(`data-${currentLang}`);

            const searchInput = document.getElementById('search-input');
            searchInput.placeholder = currentLang === 'zh' 
                ? '搜索项目名称、技术栈或关键词 (按 / 聚焦)...' 
                : 'Search project name, language or keywords (press / to focus)...';
        }

        function renderCategoryPills() {
            const container = document.getElementById('category-pills');
            const total = store.totalRepos;
            
            let pillsHtml = `
                <button class="cat-pill ${activeCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">
                    ${currentLang === 'zh' ? '全部' : 'All'} (${total})
                </button>
            `;

            store.categories.forEach(cat => {
                const count = cat.repos.length;
                const name = cat.name[currentLang] || cat.name.zh;
                const isActive = activeCategory === cat.id;
                pillsHtml += `
                    <button class="cat-pill ${isActive ? 'active' : ''}" onclick="setCategory('${cat.id}')">
                        ${name} (${count})
                    </button>
                `;
            });

            container.innerHTML = pillsHtml;
        }

        function setCategory(catId) {
            activeCategory = catId;
            renderCategoryPills();
            handleSearch();
        }

        function handleSearch() {
            const query = (document.getElementById('search-input').value || '').toLowerCase().trim();
            const container = document.getElementById('projects-container');
            const countLabel = document.getElementById('results-count');

            let totalMatches = 0;
            let outputHtml = '';

            const categoriesToSearch = activeCategory === 'all' 
                ? store.categories 
                : store.categories.filter(c => c.id === activeCategory);

            categoriesToSearch.forEach(cat => {
                const matchedRepos = cat.repos.filter(r => {
                    if (!query) return true;
                    const name = r.name.toLowerCase();
                    const lang = (r.lang || '').toLowerCase();
                    const descZh = (r.desc && r.desc.zh ? r.desc.zh : '').toLowerCase();
                    const descEn = (r.desc && r.desc.en ? r.desc.en : '').toLowerCase();
                    return name.includes(query) || lang.includes(query) || descZh.includes(query) || descEn.includes(query);
                });

                if (matchedRepos.length > 0) {
                    totalMatches += matchedRepos.length;
                    const catName = cat.name[currentLang] || cat.name.zh;

                    outputHtml += `
                        <section class="category-block">
                            <div class="category-title-bar">
                                <h2 class="category-title">${catName}</h2>
                                <span class="category-count">${matchedRepos.length} ${currentLang === 'zh' ? '个项目' : 'projects'}</span>
                            </div>
                            <div class="projects-grid">
                                ${matchedRepos.map(r => renderProjectCard(r)).join('')}
                            </div>
                        </section>
                    `;
                }
            });

            if (totalMatches === 0) {
                outputHtml = `
                    <div class="empty-state">
                        ${currentLang === 'zh' ? '无匹配的项目，请尝试其他关键词' : 'No matching projects found. Try different keywords.'}
                    </div>
                `;
            }

            countLabel.innerText = currentLang === 'zh' 
                ? `展示 ${totalMatches} 个项目` 
                : `Showing ${totalMatches} projects`;

            container.innerHTML = outputHtml;
        }

        function renderProjectCard(r) {
            const desc = (r.desc && r.desc[currentLang]) ? r.desc[currentLang] : (r.desc?.zh || r.name);
            const dateStr = (r.pushed_at || '').substring(0, 7);
            
            const demoBadge = r.homepage ? `
                <a href="${r.homepage}" target="_blank" rel="noopener noreferrer" class="demo-badge" title="${currentLang === 'zh' ? '打开在线演示 Demo' : 'Open Live Demo'}">
                    <span>Live Demo</span>
                    <span>↗</span>
                </a>
            ` : '';

            const starBadge = r.stars ? `
                <span class="star-badge" title="GitHub Stars">★ ${r.stars >= 1000 ? (r.stars/1000).toFixed(1) + 'k' : r.stars}</span>
            ` : '';

            return `
                <div class="project-card">
                    <div>
                        <div class="card-header">
                            <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="project-title">${r.name}</a>
                            <div class="header-badges">
                                ${starBadge}
                                ${demoBadge}
                            </div>
                        </div>
                        <p class="project-desc">${desc}</p>
                    </div>
                    <div class="card-footer">
                        <span class="lang-pill">${r.lang || 'Other'}</span>
                        <span class="card-date">${dateStr}</span>
                    </div>
                </div>
            `;
        }

        // Keyboard Shortcut: '/' to focus search
        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });

        // Init
        updateLangUI();
        renderCategoryPills();
        handleSearch();
    </script>
