<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>末班之后｜上海地铁时间地图</title><meta name="description" content="拖动时间，查看上海地铁14条线路各站两个方向的首末班服务状态。"><script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg" type="image/svg+xml"><script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script></head>
<body>
<header><a class="brand" href="index.html"><span class="mark" aria-hidden="true">↗</span><strong>末班之后</strong><span>上海地铁时间地图</span></a><div class="header-actions"><button type="button" data-theme-toggle aria-label="切换深色模式">深色</button><a href="sources.html">数据来源</a></div></header>
<main>
<details class="notice"><summary>按官方时刻表展示，不是实时到站信息</summary><p>数据核验于 2026-11-16。包含常规延时和定点加班车，不含节假日临时调整、封站与延误。<a href="sources.html">查看计算规则</a></p></details>
<section class="workspace">
<div class="map-panel">
<div class="search-row"><label for="station">查找车站<input id="station" type="search" list="station-options" placeholder="输入站名，如人民广场" autocomplete="off" aria-describedby="station-message"><datalist id="station-options"></datalist></label><label for="line-select">查看线路<select id="line-select" aria-label="查看线路"></select></label><p id="station-message" role="status"></p></div>
<div class="map-toolbar"><div class="map-actions"><button id="minus" aria-label="缩小地图">−</button><button id="fit">全图</button><button id="city">市区</button><button id="readable">放大站名</button><button id="plus" aria-label="放大地图">＋</button></div><div class="legend"><span><i class="closed-key"></i>灰色：该方向无车可乘</span><span><i class="extra-key"></i>虚线：仅加班车</span></div></div>
<div class="line-filters" id="line-filters" aria-label="线路筛选"></div>
<div class="map-scroll" id="map-scroll" tabindex="0" aria-label="地铁线路图，可拖动或用方向键平移"><svg id="map" role="group" aria-label="上海地铁14条线路双向服务示意图"></svg></div>
<div class="map-foot"><span id="count"></span><button id="show-detail">查看人民广场时刻</button></div>
</div>
<aside id="station-details" tabindex="-1"><div id="detail"></div><details class="explainer"><summary>怎样看这张图？</summary><p>沿箭头方向看：彩色表示本站仍有后续车，灰色表示首班未开始或末班已结束。每条线路从本站到相邻站算一个乘车方向。它不保证能赶上换乘。</p><p>站名太小可点“放大站名”。示意图沿用官方布局，不按真实地理比例绘制。</p></details></aside>
</section>
<section class="timeline" aria-label="查看时间">
<div class="time-top"><div><span id="mode"></span><strong id="selected-time">--:--</strong><span id="viewing-date"></span></div><div class="time-actions"><button id="play" aria-pressed="false">播放</button><button id="now">回到现在</button></div></div>
<div class="date-row"><label><span id="date-label">查看日期</span><input id="date" type="date" aria-label="查看日期"></label><label>时间<input id="time-input" type="time" aria-label="跳转到指定时间"></label><button id="range" aria-pressed="false">夜间 21:00–02:00</button></div>
<input id="slider" type="range" min="0" max="1439" step="1" aria-label="时间轴"><div class="ticks" id="ticks"></div>
<div class="timeline-bottom"><span id="calendar-note"></span><div class="presets"><button data-time="360">06:00</button><button data-time="1320">22:00</button><button data-time="1380">23:00</button><button data-time="30">00:30</button></div></div>
</section>
<footer><span>独立工具，非上海地铁官方产品。v1.0.0 · <a href="https://github.com/holynova/shanghai-metro-night" target="_blank" rel="noopener">GitHub</a></span><span>本站提供站台发车时刻，不是进站截止时间。</span></footer>
</main><script type="module" src="app.mjs"></script></body></html>
