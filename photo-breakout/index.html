<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="照片在浏览器本地自动抠像，加上穿过画面的白色网格或竖格，导出 PNG。">
  <meta name="theme-color" content="#f8f9f6">
  <title>破框 · Photo Breakout</title>
  <link rel="canonical" href="https://xiaosang.cc/photo-breakout/">
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="stylesheet" href="./src/style.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script>
</head>
<body>
  <div id="stage" data-version="v1.0.0"></div>
  <div id="status" class="status" role="status" hidden></div>
  <dialog id="choose" aria-labelledby="choose-title">
    <div class="dialog-head">
      <h2 id="choose-title">打开照片</h2>
      <form method="dialog"><button class="btn" aria-label="关闭">关闭</button></form>
    </div>
    <p class="subtle" id="choose-note">选择一张照片，在本机自动识别人像。</p>
    <div class="dialog-actions">
      <button type="button" id="sample-choice" class="btn">打开雪山示例</button>
      <button type="button" id="browse-choice" class="btn primary">从本机选择</button>
    </div>
    <input type="file" id="local-file" accept="image/*" hidden>
  </dialog>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
